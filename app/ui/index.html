<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型切换 · AI Switch</title>
<style>
:root { --accent: #2f6bff; --bg: #f4f6fa; --card: #fff; --text: #1d2129; --muted: #86909c; --line: #e5e6eb; --ok: #00b42a; --warn: #ff7d00; --err: #f53f3f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
.wrap { max-width: 980px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
header img { width: 40px; height: 40px; }
header h1 { font-size: 20px; font-weight: 600; }
header .sub { color: var(--muted); font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: #e8f3ff; color: var(--accent); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.badge.err { background: #ffece8; color: var(--err); }
.badge.err .dot { background: var(--err); }
.badge.warn { background: #fff3e8; color: var(--warn); }
.badge.warn .dot { background: var(--warn); }
.card { background: var(--card); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { border: 2px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; transition: all .15s; position: relative; }
.mode:hover { border-color: var(--accent); }
.mode.active { border-color: var(--ok); background: #f7fff9; }
.mode.active::after { content: "● 当前"; position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--ok); }
.mode.busy { opacity: .6; pointer-events: none; }
.mode .t { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.mode .d { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.mode .g { font-size: 11px; color: var(--accent); background: #e8f3ff; border-radius: 8px; padding: 2px 8px; display: inline-block; }
.mode button { width: 100%; margin-top: 10px; border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 0; font-size: 13px; cursor: pointer; }
.mode.active button { background: #f2f3f5; color: var(--muted); }
.svc-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f2f3f5; font-family: ui-monospace, monospace; }
.st { font-size: 12px; padding: 1px 10px; border-radius: 10px; }
.st.active { background: #e8ffea; color: var(--ok); }
.st.inactive, .st.failed { background: #f2f3f5; color: var(--muted); }
.gpus { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gpu { background: #f7f8fa; border-radius: 10px; padding: 12px 14px; }
.gpu .nm { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.gpu .bar { height: 10px; background: #e5e6eb; border-radius: 5px; overflow: hidden; margin-bottom: 4px; }
.gpu .bar > i { display: block; height: 100%; background: var(--accent); }
.gpu .txt { font-size: 11px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
.btn:hover { opacity: .9; }
.btn.ghost { background: #f2f3f5; color: var(--text); }
.log { background: #1d2129; color: #c9cdd4; border-radius: 8px; padding: 12px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.7; max-height: 180px; overflow-y: auto; }
.log div { white-space: pre-wrap; word-break: break-all; }
.empty { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; margin-right: 5px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="/images/icon_256.png" onerror="this.style.display='none'">
  <div>
    <h1>大模型切换 <span class="badge" id="hostBadge"><span class="dot"></span><span id="hostText">检测中</span></span></h1>
    <div class="sub" id="hostSub">远程 GPU 主机服务模式管理</div>
  </div>
</header>

<div class="card">
  <h2>服务模式 <span style="font-size:11px;color:var(--muted)">同一时间只能运行一种 GPU 服务</span></h2>
  <div class="modes" id="modes"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="wolBtn">🖥️ WOL 唤醒主机</button>
    <button class="btn ghost" id="refreshBtn">刷新状态</button>
    <span style="font-size:12px;color:var(--muted)" id="uptime"></span>
  </div>
</div>

<div class="card">
  <h2>GPU 状态</h2>
  <div class="gpus" id="gpus"><div class="empty">等待主机上线…</div></div>
</div>

<div class="card">
  <h2>服务详情 <span style="font-size:11px;color:var(--muted)">含自动休眠计时器</span></h2>
  <div id="svcs"><div class="empty">等待主机上线…</div></div>
</div>

<div class="card">
  <h2>操作日志</h2>
  <div class="log" id="log"></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
let MODES = null, busy = false;

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  try { return await r.json(); } catch(e) { return {}; }
}

function badge(text, cls) {
  return `<span class="st ${cls}">${text}</span>`;
}
function fmtUptime(s) {
  s = parseFloat(s);
  if (isNaN(s)) return '';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return `已运行 ${h} 小时 ${m} 分钟`;
}

async function refresh() {
  const s = await api('/api/status');
  MODES = s.modes || MODES;
  const b = $('hostBadge'), t = $('hostText');
  if (s.online) { b.className = 'badge'; t.textContent = (s.host || '') + ' 在线'; }
  else { b.className = 'badge err'; t.textContent = '主机离线'; }
  $('uptime').textContent = s.online && s.data ? fmtUptime(s.data.uptime) : '';
  const d = s.data || {};
  // 模式卡片
  const cur = d.mode, switching = s.switching;
  $('modes').innerHTML = Object.entries(MODES || {}).map(([k, m]) => {
    const active = cur === k, pending = switching === k;
    return `<div class="mode ${active ? 'active' : ''} ${busy ? 'busy' : ''}">
      <div class="t">${m.title}</div><div class="d">${m.desc}</div><div class="g">${m.gpu}</div>
      <button onclick="doSwitch('${k}')">${active ? '运行中' : (pending ? '切换中…' : '切换到此模式')}</button>
    </div>`;
  }).join('');
  // GPU
  if (d.gpus) {
    $('gpus').innerHTML = d.gpus.map(g => {
      const pct = Math.round(g.mem_used / g.mem_total * 100);
      return `<div class="gpu"><div class="nm">GPU${g.index} · ${g.name.replace('Tesla ', '')}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="txt">${(g.mem_used/1024).toFixed(1)} / ${(g.mem_total/1024).toFixed(0)} GB · 利用率 ${g.util}%</div></div>`;
    }).join('');
  } else { $('gpus').innerHTML = '<div class="empty">主机离线</div>'; }
  // 服务
  if (d.services) {
    const rows = Object.entries(d.services).map(([k, v]) =>
      `<div class="svc-row"><span>${k}</span>${badge(v, v)}</div>`).join('');
    const ap = d.auto_power || {};
    const apRows = Object.entries(ap).map(([k, v]) =>
      `<div class="svc-row"><span>${k}</span>${badge(v, v)}</div>`).join('');
    const ep = d.endpoints || {};
    const epRows = Object.entries(ep).map(([k, v]) =>
      `<div class="svc-row"><span>endpoint ${k}</span>${badge(v ? '在线' : '离线', v ? 'active' : 'inactive')}</div>`).join('');
    $('svcs').innerHTML = rows + `<div style="margin:8px 0 2px;font-size:12px;color:var(--muted)">自动休眠计时器 (切换时自动停用)</div>` + apRows +
      `<div style="margin:8px 0 2px;font-size:12px;color:var(--muted)">HTTP 端点</div>` + epRows;
  } else { $('svcs').innerHTML = '<div class="empty">主机离线</div>'; }
  // 日志
  const lg = await api('/api/log');
  if (lg.log) $('log').innerHTML = lg.log.map(l => `<div>${l}</div>`).join('');
  // 继续轮询
  if (!busy) setTimeout(refresh, 10000);
}

async function doSwitch(mode) {
  if (busy) return; busy = true;
  $$('button').disabled = true;
  const r = await api('/api/switch', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode})});
  if (r.error) { alert('切换失败: ' + r.error); }
  busy = false;
  refresh();
}
$$ = sel => document.querySelectorAll(sel);
$('wolBtn').addEventListener('click', async () => {
  $('wolBtn').innerHTML = '<span class="spin" style="border-color:#1d2129;border-top-color:transparent"></span>发送中';
  const r = await api('/api/wol', {method: 'POST'});
  $('wolBtn').innerHTML = '🖥️ WOL 唤醒主机';
  if (r.message) alert(r.message);
  setTimeout(refresh, 3000);
});
$('refreshBtn').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
